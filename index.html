<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>약국 영양제 관리 & 복약 상담 대시보드</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    
    <!-- PWA 메타태그 및 매니페스트 설정 -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0ea5e9" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PharmAssist" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  </head>
  <body class="bg-slate-100 text-slate-900 antialiased font-sans overflow-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            // 새 버전 즉시 확인
            reg.update();
            reg.addEventListener('updatefound', () => {
              const newWorker = reg.installing;
              if (newWorker) {
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    console.log('새 버전 감지됨: 자동 새로고침 진행');
                    window.location.reload();
                  }
                });
              }
            });
          }).catch((err) => {
            console.log('SW registration failed:', err);
          });

          // 새 서비스워커 활성화 시 자동 새로고침
          let isRefreshing = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (!isRefreshing) {
              isRefreshing = true;
              window.location.reload();
            }
          });
        });
      }
    </script>
  </body>
</html>
